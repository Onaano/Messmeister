<style>

  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overscroll-behavior:none; }
  body{
    font-family:var(--font-body); color:var(--ink);
    background:linear-gradient(180deg, #dfe8d6 0%, #eef0e0 45%, var(--cream) 100%);

  button{ font-family:inherit; cursor:pointer; border:none; background:none; padding:0; color:inherit; }

  .title-big{ font-family:var(--font-display); font-weight:800; font-size:clamp(23px,4.2vw,38px); color:var(--terrakotta-dark); margin:1vh 0 0; text-align:center; }

  .mode-card{ background:var(--panel); border:2.2px solid var(--panel-edge); border-radius:16px; padding:1.6vh 1.6vw; display:flex; flex-direction:column; align-items:center; gap:.8vh; box-shadow:0 5px 0 rgba(58,50,38,.12); transition:transform .1s ease; min-height:132px; justify-content:center; }
  .mode-card:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(58,50,38,.12); }
  .mode-icon{ width:46px; height:46px; } .mode-icon svg{ width:100%; height:100%; display:block; }
  .mode-title{ font-family:var(--font-display); font-weight:800; font-size:clamp(12px,1.6vw,14.5px); text-align:center; }

  #screen-sub{ gap:2vh; padding:2vh 4vw 14vh; }
  .sub-title{ font-family:var(--font-display); font-weight:800; font-size:clamp(18px,2.8vw,25px); color:var(--terrakotta-dark); text-align:center; margin:0; }
  .sub-step{ font-family:var(--font-display); font-weight:700; font-size:clamp(12px,1.8vw,15px); color:var(--muted); text-align:center; }
  .sub-choices{ display:flex; gap:2.2vw; flex-wrap:wrap; justify-content:center; max-width:780px; }

  .vessel-wrap svg{ height:min(38vh,320px); width:auto; max-width:100%; display:block; }

  .cards-row{ display:grid; gap:1.6vh 2.4vw; width:min(100%,900px); grid-template-columns:repeat(2,minmax(0,1fr)); }

  @media (max-width:760px){ .cards-row.how{ grid-template-columns:1fr; } }
  .tap-card{ background:var(--panel); border:3px solid var(--panel-edge); border-radius:16px; padding:1.4vh 1.2vw; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6vh; box-shadow:0 4px 0 rgba(58,50,38,.12); transition:transform .1s ease; min-height:70px; }
  .tap-card:active{ transform:translateY(3px); }
  .tc-icon{ width:clamp(64px,13vh,110px); height:clamp(64px,13vh,110px); } .tc-icon svg{ width:100%; height:100%; display:block; }
  .tc-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(12px,1.7vw,15px); color:var(--muted); }
  .tc-text{ font-family:var(--font-display); font-weight:800; font-size:clamp(16px,2.6vw,24px); }

  .cards-row.vessels .vessel-wrap svg{ height:min(30vh,250px); }
  .cards-row.how .mm-svg{ max-height:none; }
  .sign-row{ display:flex; align-items:center; justify-content:center; gap:2.4vw; flex-wrap:wrap; }
  .sign-side{ font-family:var(--font-display); font-weight:800; font-size:clamp(22px,4.2vw,40px); background:var(--cream); border-radius:14px; padding:1vh 2.6vw; }
  .sign-q{ font-family:var(--font-display); font-weight:800; font-size:clamp(24px,4.4vw,42px); color:var(--terrakotta-dark); }
  .sign-btns{ display:flex; gap:3vw; }
  .sign-btn{ width:clamp(64px,12vw,96px); height:clamp(64px,12vw,96px); border-radius:18px; background:var(--panel); border:3px solid var(--panel-edge); box-shadow:0 4px 0 rgba(58,50,38,.12); font-family:var(--font-display); font-weight:800; font-size:clamp(30px,6vw,48px); }
  .sign-btn:active{ transform:translateY(3px); }

  #screen-end{ gap:1.4vh; text-align:center; padding:2vh 4vw 16vh; overflow-y:auto; width:100%; }
  .end-art{ display:flex; gap:2vw; justify-content:center; margin:1vh 0; } .end-art .ea{ width:clamp(48px,9vw,76px); height:clamp(48px,9vw,76px); } .end-art svg{ width:100%; height:100%; }
  .end-title{ font-family:var(--font-display); font-weight:800; font-size:clamp(19px,3.4vw,30px); margin:0; }
  .end-sub{ font-family:var(--font-display); font-weight:700; font-size:clamp(13px,1.9vw,17px); color:var(--terrakotta-dark); margin:0; }
  .end-actions{ display:flex; gap:3vw; margin-top:.5vh; flex-wrap:wrap; justify-content:center; }
  .btn-primary{ font-family:var(--font-display); font-weight:800; font-size:clamp(13px,1.9vw,16px); color:#fff; background:var(--terrakotta-dark); border-radius:999px; padding:1.7vh 5.2vw; box-shadow:0 8px 18px -8px rgba(180,94,57,.5); min-height:48px; }
  .btn-secondary{ font-family:var(--font-display); font-weight:800; font-size:clamp(13px,1.9vw,16px); background:var(--panel); border:2px solid var(--panel-edge); border-radius:999px; padding:1.7vh 5.2vw; min-height:48px; }
  .btn-primary:active, .btn-secondary:active{ transform:scale(.96); }
  @media (max-width:560px){ .end-actions{ flex-direction:column; width:100%; } }
  @media (max-height:600px){ .mode-card{ min-height:96px; padding:1vh 1.4vw; } .mode-icon{ width:34px; height:34px; } }
</style>

<script>
(function(){
"use strict";
"use strict";
/* ===== MESSMEISTER: Kern (Einheiten, Umrechnung, Formatierung, Vergleich) ===== */
function clean(x){ return Math.round(x*1e6)/1e6; }
function DE(n){ return String(clean(n)).replace('.', ','); }
const UNITS = {
  mm:{kind:'len',f:1}, cm:{kind:'len',f:10}, m:{kind:'len',f:1000}, km:{kind:'len',f:1000000},
  g:{kind:'wei',f:1}, kg:{kind:'wei',f:1000},
  ml:{kind:'vol',f:1}, l:{kind:'vol',f:1000}
};
const BASE = {len:'mm', wei:'g', vol:'ml'};
const KIND_UNIT_ORDER = {len:['km','m','cm','mm'], wei:['kg','g'], vol:['l','ml']};
function convert(v, from, to){
  if(UNITS[from].kind !== UNITS[to].kind) throw new Error('Einheitenart passt nicht: '+from+' -> '+to);
  return clean(v*UNITS[from].f/UNITS[to].f);
}
function convertLength(v, from, to){ if(UNITS[from].kind!=='len'||UNITS[to].kind!=='len') throw new Error('keine Laenge'); return convert(v,from,to); }
function convertWeight(v, from, to){ if(UNITS[from].kind!=='wei'||UNITS[to].kind!=='wei') throw new Error('kein Gewicht'); return convert(v,from,to); }
function convertVolume(v, from, to){ if(UNITS[from].kind!=='vol'||UNITS[to].kind!=='vol') throw new Error('kein Volumen'); return convert(v,from,to); }
function toBase(m){ return convert(m.v, m.u, BASE[UNITS[m.u].kind]); }
function formatMeasure(v, u){ return DE(v)+' '+u; }
function formatBase(base, kind, unit){
  if(unit) return formatMeasure(convert(base, BASE[kind], unit), unit);
  for(const u of KIND_UNIT_ORDER[kind]){
    const v = convert(base, BASE[kind], u);
    if(Number.isInteger(v) && v >= 1) return formatMeasure(v, u);
  }
  return formatMeasure(base, BASE[kind]);
}
function formatLength(mm, unit){ return formatBase(mm, 'len', unit); }
function formatWeight(g, unit){ return formatBase(g, 'wei', unit); }
function formatVolume(ml, unit){ return formatBase(ml, 'vol', unit); }
// zusammengesetzt, z. B. 1500 g -> "1 kg 500 g" (base = Basiseinheit mm/g/ml)
function formatCompound(base, big, small){
  const bf = UNITS[big].f, sf = UNITS[small].f;
  const bigVal = Math.floor(base/bf);
  const rem = base - bigVal*bf;
  const smallVal = rem/sf;
  if(!Number.isInteger(smallVal)) throw new Error('nicht glatt teilbar');
  if(bigVal === 0) return smallVal+' '+small;
  if(smallVal === 0) return bigVal+' '+big;
  return bigVal+' '+big+' '+smallVal+' '+small;
}
function compareMeasurements(a, b){
  const x = typeof a === 'number' ? a : toBase(a);
  const y = typeof b === 'number' ? b : toBase(b);
  return x < y ? -1 : (x > y ? 1 : 0);
}

function nb(s){ return String(s).replace(/(\d) (km|kg|mm|cm|ml|m|g|l)\b/g, '$1\u00A0$2'); }

/* Lineal + Gegenstand in EINEM Koordinatensystem: x(mm) = X0 + mm * S/10, S = SVG-Einheiten pro virtuellem cm */
function measureSvg(o){
  const W=1000, H=(o.tilt?330:236), X0=100, S=800/o.maxCm, yR=140;
  const xOf = mm => X0 + mm*S/10;
  const xs = xOf(o.startMm), xe = xOf(o.endMm);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="mm-svg" role="img" aria-label="Lineal mit Gegenstand" data-max-cm="${o.maxCm}" data-s="${S}" data-x0="${X0}">`;
  s += `<g class="obj" data-start-mm="${o.startMm}" data-end-mm="${o.endMm}" data-xs="${xs}" data-xe="${xe}">${OBJ_DRAW[o.obj](xs, xe, yR-8, o.variant)}</g>`;
  if(!o.noGuides) s += `<line class="guide" x1="${xs}" y1="22" x2="${xs}" y2="${yR}" stroke="#b45e39" stroke-width="2.5" stroke-dasharray="6 6" opacity=".6"/><line class="guide" x1="${xe}" y1="22" x2="${xe}" y2="${yR}" stroke="#b45e39" stroke-width="2.5" stroke-dasharray="6 6" opacity=".6"/>`;
  s += o.tilt ? `<g transform="rotate(${o.tilt} ${X0-40} ${yR})">` : `<g>`;
  s += `<rect x="${X0-40}" y="${yR}" width="${o.maxCm*S+80}" height="90" rx="7" fill="#f3d9a6" stroke="#b8975a" stroke-width="3"/>`;
  const detail = o.detail || 'cm';
  for(let i=0;i<=o.maxCm*10;i++){
    const isCm = i%10===0, isHalf = i%5===0 && !isCm;
    if(!isCm && !(isHalf && (detail==='half'||detail==='mm')) && !(detail==='mm')) continue;
    const len = isCm ? 40 : (isHalf ? 28 : 17);
    s += `<line class="tk" data-mm="${i}" x1="${xOf(i)}" y1="${yR}" x2="${xOf(i)}" y2="${yR+len}" stroke="#3a3226" stroke-width="${isCm?3.4:(isHalf?2.4:1.6)}"/>`;
    if(isCm) s += `<text class="tl" data-cm="${i/10}" x="${xOf(i)}" y="${yR+78}" font-size="${o.maxCm>12?23:32}" font-weight="800" text-anchor="middle" fill="#3a3226" font-family="system-ui,sans-serif">${i/10}</text>`;
  }
  s += `<text x="${X0+o.maxCm*S+22}" y="${yR+30}" font-size="22" font-weight="800" fill="#4a4136" font-family="system-ui,sans-serif">cm</text>`;
  s += `</g></svg>`;
  return s;
}

/* Messbecher / Messkrug: Skala und Wasserstand aus DERSELBEN Funktion yOf(ml) */
let vesselCounter = 0;
function vesselSvg(o){ // o:{cap, level, tick, labelEvery, label(ml)->text, style:'beaker'|'jug'}
  const id = 'vc'+(++vesselCounter);
  const xL=100, xR=180, yT=36, yB=300, Hh=yB-yT;
  const yOf = ml => yB - ml/o.cap*Hh;
  const glass = `M${xL},${yT} V${yB-9} Q${xL},${yB} ${xL+9},${yB} H${xR-9} Q${xR},${yB} ${xR},${yB-9} V${yT}`;
  let s = `<svg viewBox="0 0 250 330" class="vessel-svg" role="img" aria-label="${o.style==='jug'?'Messkrug':'Messbecher'} mit Skala" data-cap="${o.cap}" data-level="${o.level}" data-yb="${yB}" data-ht="${Hh}">`;
  s += `<defs><clipPath id="${id}"><path d="${glass} Z"/></clipPath></defs>`;
  const wy = yOf(o.level);
  s += `<rect class="water" data-level="${o.level}" x="${xL}" y="${wy}" width="${xR-xL}" height="${yB-wy}" fill="#8fb9c9" opacity=".85" clip-path="url(#${id})"/>`;
  s += `<line class="surface" x1="${xL}" y1="${wy}" x2="${xR}" y2="${wy}" stroke="#5f93a6" stroke-width="3"/>`;
  s += `<path d="${glass}" fill="none" stroke="#7a7062" stroke-width="4" stroke-linecap="round"/>`;
  s += `<path d="M${xL-7},${yT} H${xR+7}" stroke="#7a7062" stroke-width="5" stroke-linecap="round"/>`;
  if(o.style==='jug') s += `<path d="M${xR},${yT+34} C${xR+44},${yT+34} ${xR+44},${yT+130} ${xR},${yT+130}" fill="none" stroke="#7a7062" stroke-width="7" stroke-linecap="round"/>`;
  for(let ml=0; ml<=o.cap+1e-9; ml+=o.tick){
    const y = yOf(ml), lab = Math.round(ml/o.tick) % o.labelEvery === 0;
    s += `<line class="vt" data-ml="${ml}" x1="${xL}" y1="${y}" x2="${xL-(lab?24:13)}" y2="${y}" stroke="#3a3226" stroke-width="${lab?3:1.8}"/>`;
    if(lab) s += `<text class="vl" data-ml="${ml}" x="${xL-29}" y="${y+5}" font-size="15" font-weight="800" text-anchor="end" fill="#3a3226" font-family="system-ui,sans-serif">${o.label(ml)}</text>`;
  }
  if(o.unit) s += `<text x="${xL-29}" y="${yT-14}" font-size="16" font-weight="800" text-anchor="end" fill="#665c50" font-family="system-ui,sans-serif">${o.unit}</text>`;
  s += `</svg>`;
  return s;
}

/* ===== MESSMEISTER: Aufgabengeneratoren ===== */
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
const GEN = { used:new Set(), shown:new Set() };   // used: Aufgaben/Gegenstaende als Aufgabenziel, shown: Gegenstaende, die schon irgendwo gezeigt wurden
function itemKey(icon){ return `it|${icon}`; }   // pro Gegenstand (nicht pro Bereich): Radiergummi als Laenge UND als Gewicht zaehlt als derselbe Gegenstand
// Wiederholungsschutz: mehrfach neu wuerfeln, bis die Aufgabe in dieser Runde noch nicht vorkam
function uniq(fn){ let t; for(let i=0;i<60;i++){ t=fn(); if(!GEN.used.has(t.key)){ GEN.used.add(t.key); return t; } } GEN.used.add(t.key); return t; }
// Gegenstaende, die in dieser Runde noch nicht gezeigt wurden, zuerst (sonst bleibt die Reihenfolge zufaellig)
function preferUnseen(list){ const s=shuffle(list); return s.filter(o=>!GEN.shown.has(itemKey(o.icon,o.area))).concat(s.filter(o=>GEN.shown.has(itemKey(o.icon,o.area)))); }
// Aufgabenziel: bevorzugt Gegenstaende, die in dieser Runde noch nirgends gezeigt wurden
function pickTarget(pool, iconOf, areaOf){ const un=pool.filter(r=>!GEN.shown.has(itemKey(iconOf(r),areaOf(r)))); return pick(un.length?un:pool); }
const tIcon=r=>r.icon, tArea=r=>r.area;
function distinctByIcon(list, n, excludeIcons){
  const out=[], seen=new Set(excludeIcons||[]);
  for(const o of list){ if(out.length>=n) break; if(seen.has(o.icon)) continue; seen.add(o.icon); out.push(o); }
  return out;
}
function artCap(a){ return a.charAt(0).toUpperCase()+a.slice(1); }

/* Antwortoptionen: richtige Zahl + typische Fehler (extras) + Nachbarwerte; immer 4 verschiedene */
function numOptions(correct, extras, step, lo, hi){
  const cands = extras.slice();
  for(let k=1;k<=8;k++){ cands.push(correct+k*step, correct-k*step); }
  const out=[correct];
  for(const c of cands){
    const v=clean(c);
    if(out.length>=4) break;
    if(v<lo || v>hi) continue;
    if(out.some(o=>Math.abs(o-v)<1e-9)) continue;
    out.push(v);
  }
  return out;
}
function mcFrom(correct, extras, step, lo, hi, fmt){
  const nums=numOptions(correct, extras, step, lo, hi);
  return { answer:fmt(correct), options:shuffle(nums.map(fmt)) };
}
const figIcon = key => `<div class="fig-icon">${iconSvg(key)}</div>`;
const figSvg = svg => `<div class="fig-svg">${svg}</div>`;

/* Messgegenstand: bevorzugt einen, der in dieser Runde noch nicht vorkam */
function pickObj(){
  const keys=Object.keys(OBJ_META), un=keys.filter(k=>!GEN.shown.has(itemKey(OBJ_ICON[k])));
  const o=pick(un.length?un:keys); GEN.shown.add(itemKey(OBJ_ICON[o])); return o;
}
/* ---------- Modus 1: Miss nach! ---------- */
function rulerMaxCm(e){ return e<=10 ? 10 : (e<=15 ? 15 : 20); }
function genRuler(level){
  return uniq(()=>{
    const obj = pickObj(), meta = OBJ_META[obj], variant=randInt(0,3);
    let s, L, e, maxCm, detail='cm', unit='cm', mc;
    if(level==='leicht'){
      s=0; L=randInt(2,10); e=L; maxCm=10;
      mc=mcFrom(L, [], 1, 1, 10, v=>formatMeasure(v,'cm'));
    } else if(level==='mittel'){
      do{ s=randInt(1,12); L=randInt(2,10); e=s+L; }while(e>20);
      maxCm=rulerMaxCm(e);
      mc=mcFrom(L, [e], 1, 1, maxCm, v=>formatMeasure(v,'cm'));
    } else if(Math.random()<0.55){            // schwer: halbe Zentimeter
      do{ s=randInt(0,12)/2; L=randInt(4,18)/2; e=s+L; }while(e>15 || (Number.isInteger(s)&&Number.isInteger(L)));
      maxCm=rulerMaxCm(e); detail='half';
      mc=mcFrom(L, s>0?[e, L+0.5, L-0.5]:[L+0.5, L-0.5], 0.5, 0.5, maxCm, v=>formatMeasure(v,'cm'));
    } else {                                   // schwer: Millimeter
      unit='mm'; maxCm=10; detail='mm';
      s = Math.random()<0.5 ? 0 : randInt(5,40);
      do{ L=randInt(15,95); e=s+L; }while(e>100);
      mc=mcFrom(L, [e, L+1, L-1, L+10, L-10], 1, 5, 100, v=>v+' mm');
    }
    const startMm = unit==='mm' ? s : s*10, endMm = unit==='mm' ? e : e*10;
    const prompt = `Wie ${meta[2]} ist ${meta[0]} ${meta[1]}?`;
    return { key:`r|${obj}|${startMm}|${endMm}`, kind:'ruler', type:'mc', prompt, spoken:prompt,
      fig:figSvg(measureSvg({obj, startMm, endMm, maxCm, detail, variant})), options:mc.options, answer:mc.answer,
      meta:{obj, startMm, endMm, maxCm, detail, lengthMm:endMm-startMm} };
  });
}

/* ---------- Umrechnungs-Optionen (Modus 5D und 7) ---------- */
const COMPOUND = { len:[['km','m'],['m','cm'],['cm','mm']], wei:[['kg','g']], vol:[['l','ml']] };
function distinctStrings(list){ const seen=new Set(), out=[]; for(const x of list){ if(!seen.has(x)){ seen.add(x); out.push(x); } } return out; }
// Ziel: einfache Einheit; Optionen sind Zahlen (mit/ohne Einheit)
function convSimpleOptions(T, toU, withUnit){
  const kind=UNITS[toU].kind, V=convert(T, BASE[kind], toU);
  const fmt = v => withUnit ? formatMeasure(v,toU) : DE(v);
  const cands=[V*10, V/10, V*100, V/100, V*1000, V/1000].map(clean).filter(v=>Number.isInteger(v) && v>=1 && v!==V);
  const nums=[V];
  for(const c of cands){ if(nums.length>=4) break; if(!nums.includes(c)) nums.push(c); }
  return { answer:fmt(V), options:shuffle(nums.map(fmt)) };
}
// Ziel: zusammengesetzte Schreibweise "1 m 50 cm"
function convCompoundOptions(T, big, small){
  const bf=UNITS[big].f, sf=UNITS[small].f, step=bf/10;
  const bigVal=Math.floor(T/bf), rem=T-bigVal*bf;
  const cand=[];
  if(rem>0 && rem%(10*sf)===0) cand.push(bigVal*bf + rem/10);   // typischer Stellenfehler: 1 m 5 cm statt 1 m 50 cm
  cand.push(T+step, T-step, T*10, T/10, T+2*step, T-2*step);
  const fmt = t => formatCompound(t, big, small);
  const out=[fmt(T)];
  for(const c of cand){
    if(out.length>=4) break;
    if(c<=0 || c===T || !Number.isInteger(c) || c%sf!==0) continue;
    const f=fmt(c); if(!out.includes(f)) out.push(f);
  }
  return { answer:out[0], options:shuffle(out) };
}
// Zusammengesetzt -> einfach: "1 m 50 cm = ? cm"
function convFromCompoundOptions(T, big, small){
  const bf=UNITS[big].f, sf=UNITS[small].f, bigInSmall=bf/sf, stepSmall=bf/10/sf;
  const V=T/sf, bigVal=Math.floor(T/bf), rem=T-bigVal*bf;
  const cand=[];
  if(rem>0 && rem%(10*sf)===0) cand.push(bigVal*bigInSmall + rem/sf/10);
  cand.push(V+stepSmall, V-stepSmall, V*10, V/10, V+2*stepSmall);
  const nums=[V];
  for(const c of cand){ const v=clean(c); if(nums.length>=4) break; if(v<1||!Number.isInteger(v)||nums.includes(v)) continue; nums.push(v); }
  return { answer:DE(V), options:shuffle(nums.map(DE)) };
}

/* ---------- Modus 5: Schwerer oder leichter? ---------- */
function genHeavierA(minRatio){
  return uniq(()=>{
    let a,b,wa,wb;
    let tries=0;
    do{ a=pick(WEIGHT_OBJ); b=pick(WEIGHT_OBJ); wa=pick(a.w); wb=pick(b.w); tries++; }
    while(a===b || Math.max(wa,wb)/Math.min(wa,wb)<minRatio || (tries<40 && (GEN.shown.has(itemKey(a.key))||GEN.shown.has(itemKey(b.key)))));
    GEN.shown.add(itemKey(a.key)); GEN.shown.add(itemKey(b.key));
    const heavy = Math.random()<0.7;
    const cards=[a,b].map((o,i)=>({icon:o.key, title:o.name, text:formatWeight(i===0?wa:wb)}));
    const idxHeavier = wa>wb ? 0 : 1;
    const q = heavy ? pick(['Was ist schwerer?','Welcher Gegenstand ist schwerer?']) : pick(['Was ist leichter?','Welcher Gegenstand ist leichter?']);
    return { key:`ha|${a.key}${wa}|${b.key}${wb}`, kind:'heavierA', type:'cards', cardClass:'obj', prompt:q,
      spoken:`${q} ${a.name}, ${cards[0].text}, oder ${b.name}, ${cards[1].text}?`,
      cards, answerIdx: heavy ? idxHeavier : 1-idxHeavier, meta:{wa,wb,heavy} };
  });
}
function weightText(T, compoundOk){ return compoundOk ? formatCompound(T,'kg','g') : T+' g'; }
function genHeavierB(level){

      if(Math.random()<0.5){ do{ t1=randInt(2,18)*50; t2=randInt(2,18)*50; }while(Math.abs(t1-t2)<100); s1=t1+' g'; s2=t2+' g'; }
      else { do{ t1=randInt(1,9); t2=randInt(1,9); }while(t1===t2); s1=t1+' kg'; s2=t2+' kg'; t1*=1000; t2*=1000; }
    } else if(level==='mittel'){

      s1=kgFirst?k+' kg':g+' g'; s2=kgFirst?g+' g':k+' kg';

      t1=a*1000+b; t2=t1+pick([-500,-250,-100,-50,50,100,250,500]);
      s1=formatCompound(t1,'kg','g');                       // mindestens eine Angabe immer zusammengesetzt
      s2=Math.random()<0.5 ? formatCompound(t2,'kg','g') : t2+' g';
      if(Math.random()<0.5){ [t1,t2]=[t2,t1]; [s1,s2]=[s2,s1]; }

    const idxHeavier=t1>t2?0:1;

      spoken:`${q} ${s1} oder ${s2}?`, cards:[{title:'', text:s1},{title:'', text:s2}],
      answerIdx: heavy?idxHeavier:1-idxHeavier, meta:{t1,t2,heavy} };
  });
}
function genSign(level){
  return uniq(()=>{
    const out=pick(['<','=','>']);
    let L,R;
    if(level==='mittel'){
      const k=randInt(1,3);
      let g = out==='=' ? k*1000 : (out==='<' ? k*1000-pick([100,250,500]) : k*1000+pick([250,500,750]));
      if(g<=0) g=500;
      L={v:g,u:'g'}; R={v:k,u:'kg'};
    } else {
      const a=randInt(1,4), b=pick([100,200,250,500,750]), T1=a*1000+b;
      const T2 = out==='=' ? T1 : (out==='<' ? T1+pick([50,100,250,500]) : T1-pick([50,100,250,500]));
      L={t:T1}; R={t:T2};
    }
    let left, right, lb, rb;
    if(level==='mittel'){ left=formatMeasure(L.v,L.u); right=formatMeasure(R.v,R.u); lb=toBase(L); rb=toBase(R); }
    else { lb=L.t; rb=R.t; left=formatCompound(lb,'kg','g'); right=Math.random()<0.5?rb+' g':formatCompound(rb,'kg','g'); }
    if(left===right) right = rb+' g';                       // gleiche Schreibweise auf beiden Seiten waere sinnlos ("4 kg 500 g = 4 kg 500 g")
    if(Math.random()<0.5){ [left,right]=[right,left]; [lb,rb]=[rb,lb]; }
    const cmp=compareMeasurements(lb,rb), sym = cmp<0?'<':(cmp>0?'>':'=');
    return { key:`sg|${left}|${right}`, kind:'sign', type:'sign', prompt:'Setze das richtige Zeichen.', spoken:`Setze das richtige Zeichen. ${left} und ${right}.`,
      left, right, options:['<','=','>'], answer:sym };
  });
}
function genWeightEq(){
  return uniq(()=>{
    const t=randInt(0,3);
    let from, opt, base;
    if(t===0){ const k=randInt(1,9); base=k*1000; from=k+' kg'; opt=convSimpleOptions(base,'g',true); }
    else if(t===1){ const k=randInt(1,9); base=k*1000; from=base+' g'; opt=convSimpleOptions(base,'kg',true); }
    else if(t===2){ const a=randInt(1,4), b=pick([100,200,250,500,750]); base=a*1000+b; from=base+' g'; opt=convCompoundOptions(base,'kg','g'); }
    else { const a=randInt(1,4), b=pick([100,200,250,500,750]); base=a*1000+b; from=formatCompound(base,'kg','g'); opt=convSimpleOptions(base,'g',true); }
    const q=`Was ist genauso schwer wie ${from}?`;
    return { key:`weq|${from}`, kind:'weightEq', type:'mc', prompt:q, spoken:q, options:opt.options, answer:opt.answer, meta:{base} };
  });
}
function genHeavier(level){
  const r=Math.random();
  if(level==='leicht') return r<0.5 ? genHeavierA(3) : genHeavierB('leicht');
  if(level==='mittel') return r<0.25 ? genHeavierA(1.8) : (r<0.6 ? genHeavierB('mittel') : genSign('mittel'));

/* ---------- Modus 6: Wie viel ist drin? ---------- */
const lblNum = ml => String(ml);

function genDrinMissing(level){

    o.level=lv; o.style=jug?'jug':'beaker';

function genDrinCompare(){

function genVolCompare(level){

function genDrin(level){

/* ---------- Modus 7: Verwandle die Einheit! ---------- */
function convLeicht(a){
  const L={len:[[100,'cm','m'],[200,'cm','m'],[300,'cm','m'],[1,'m','cm'],[2,'m','cm'],[3,'m','cm'],[10,'mm','cm'],[20,'mm','cm'],[1,'cm','mm'],[2,'cm','mm'],[1000,'m','km'],[2000,'m','km'],[1,'km','m'],[2,'km','m']],
    wei:[[1000,'g','kg'],[2000,'g','kg'],[3000,'g','kg'],[1,'kg','g'],[2,'kg','g'],[3,'kg','g']],
    vol:[[1000,'ml','l'],[2000,'ml','l'],[3000,'ml','l'],[1,'l','ml'],[2,'l','ml'],[3,'l','ml']]};
  return pick(L[a]);
}
function convMittel(a){
  const pairs={len:[['m','cm'],['cm','m'],['mm','cm'],['cm','mm'],['km','m'],['m','km']], wei:[['kg','g'],['g','kg']], vol:[['l','ml'],['ml','l']]}[a];
  const [fu,tu]=pick(pairs);
  const big = UNITS[fu].f > UNITS[tu].f;
  const ratio = big ? UNITS[fu].f/UNITS[tu].f : UNITS[tu].f/UNITS[fu].f;
  const bigUnit = big ? fu : tu;
  const n = (bigUnit==='km' || bigUnit==='cm') ? randInt(2,9) : randInt(2,20);   // Anzahl der grossen Einheiten
  return [big ? n : n*ratio, fu, tu];
}
function genConvert(area, level){
  return uniq(()=>{
    const a = area==='mix' ? pick(['len','wei','vol']) : area;
    if(level==='schwer' && Math.random()<0.8){
      const [big,small]=pick(COMPOUND[a]);
      let T;
      if(a==='len'){
        if(big==='m') T=(randInt(1,9)*100+pick([10,20,25,30,40,50,60,70,75,80,90]))*10;
        else if(big==='cm') T=randInt(1,9)*10+randInt(1,9);
        else T=randInt(1,5)*1000000+pick([100,200,250,300,500,600,700,750,800,900])*1000;
      } else T=randInt(1,5)*1000+pick([100,200,250,300,400,500,600,700,750,800,900]);
      const smallVal=T/UNITS[small].f;
      if(Math.random()<0.5){
        const o=convCompoundOptions(T,big,small), from=smallVal+' '+small;
        return { key:`cv|${from}`, kind:'convert', type:'mc', eq:`${from} = ?`, prompt:'Verwandle die Einheit.', spoken:`Verwandle die Einheit. ${from}.`, options:o.options, answer:o.answer, meta:{T,big,small} };
      }
      const from=formatCompound(T,big,small), o=convFromCompoundOptions(T,big,small);
      return { key:`cv|${from}`, kind:'convert', type:'mc', eq:`${from} = ? ${small}`, prompt:'Verwandle die Einheit.', spoken:`Verwandle die Einheit. ${from} gleich wie viele ${small}?`, options:o.options, answer:o.answer, meta:{T,big,small} };
    }
    const [v,fu,tu] = level==='leicht' ? convLeicht(a) : convMittel(a);
    const T=toBase({v,u:fu}), o=convSimpleOptions(T,tu,false);
    return { key:`cv|${v}${fu}${tu}`, kind:'convert', type:'mc', eq:`${v} ${fu} = ? ${tu}`, prompt:'Verwandle die Einheit.', spoken:`Verwandle die Einheit. ${v} ${fu} gleich wie viele ${tu}?`, options:o.options, answer:o.answer, optClass:'num', meta:{v,fu,tu,T} };
  });
}

/* Umgekehrt: "Was wiegt ungefaehr 1 kg?" -> Gegenstand waehlen (nur klar unterscheidbare Gegenstaende) */
function genEstimateReverse(area){
  return uniq(()=>{

      const rec=pickTarget(pool,tIcon,tArea), val=pick(rec.correct), vb=toBase({v:val[0],u:val[1]});
      const others=pool.filter(o=>o.key!==rec.key && o.icon!==rec.icon && (vb/o.plausible[1]>=5 || o.plausible[0]/vb>=5));
      if(others.length<3) continue;
      const pickedO=distinctByIcon(preferUnseen(others), area==='mix'?3:2, [rec.icon]); if(pickedO.length<(area==='mix'?3:2)) continue; pickedO.concat([rec]).forEach(r=>GEN.shown.add(itemKey(r.icon,r.area)));
      const cards=shuffle([rec, ...pickedO]).map(r=>({icon:r.icon, title:EST_NAME[r.key], text:'', key:r.key}));
      const label=formatMeasure(val[0],val[1]);
      const prompt = a==='len' ? `Was misst ungefähr ${label}?` : (a==='wei' ? `Was wiegt ungefähr ${label}?` : `In welchen Gegenstand passen ungefähr ${label}?`);
      return { key:itemKey(rec.icon,rec.area), kind:'estimateRev', type:'cards', cardClass:'obj', prompt, spoken:prompt, cards, answerIdx:cards.findIndex(c=>c.key===rec.key), meta:{rec:rec.key, val, area:a} };
    }

}
/* Stimmt das? (50 % wahr, 50 % falsch) */
function genEstimateTF(area){

/* Welcher Satz stimmt? (vier Saetze zu verschiedenen Gegenstaenden, genau einer hat eine passende Groessenordnung) */
function genEstimateSentence(area){

/* Einheit ergaenzen: "Ein Bleistift ist ungefaehr 18 ... lang." */

/* Verwandle: Was ist am laengsten / schwersten / meisten? (Angaben in verschiedenen Einheiten) */
function genConvertExtreme(area){
  return uniq(()=>{
    const a=estArea(area);
    const sets={len:[300,500,800,900,1000,1200,1500,2000,2500,3000], wei:[250,500,750,900,1000,1500,2000,2500,3000], vol:[250,500,750,900,1000,1500,2000,2500,3000]};
    const units={len:['mm','cm','m'], wei:['g','kg'], vol:['ml','l']}[a];
    for(let tries=0;tries<80;tries++){
      const bases=shuffle(sets[a]).slice(0,4);
      const labels=bases.map(b=>{ const ok=units.filter(u=>Number.isInteger(convert(b,BASE[a],u))&&convert(b,BASE[a],u)>=1); return formatMeasure(convert(b,BASE[a],pick(ok)),'').trim(); });
      // Einheit wieder anhaengen (oben nur Zahl berechnet) -> sauber neu aufbauen
      const lab=bases.map(b=>{ const ok=units.filter(u=>{ const v=convert(b,BASE[a],u); return Number.isInteger(v)&&v>=1; }); const u=pick(ok); return {t:formatMeasure(convert(b,BASE[a],u),u), u}; });
      if(new Set(lab.map(x=>x.u)).size<2 || new Set(lab.map(x=>x.t)).size<4) continue;
      const biggest=Math.random()<0.6, idx=bases.indexOf(biggest?Math.max(...bases):Math.min(...bases));
      const word={len:['am längsten','am kürzesten'], wei:['am schwersten','am leichtesten'], vol:['am meisten','am wenigsten']}[a][biggest?0:1];
      const prompt=`Was ist ${word}?`;
      return { key:`cx|${lab.map(x=>x.t).sort().join('|')}`, kind:'convertExtreme', type:'mc', prompt, spoken:prompt+' '+lab.map(x=>x.t).join(', '), options:lab.map(x=>x.t), answer:lab[idx].t, optClass:'unit', meta:{bases, idx, biggest, area:a} };
    }
    return genConvert(area,'mittel');
  });
}
/* Verwandle: Stimmt das?  z. B. "300 cm = 3 m" */
function genConvertTF(area, level){
  return uniq(()=>{
    const a=estArea(area), truth=Math.random()<0.5;

      const [big,small]=pick(COMPOUND[a]);

      else t=randInt(1,5)*1000+pick([100,200,250,300,400,500,600,700,750,800,900]);

}
/* Auswahl mit Abwechslung */

function genPlausibleVar(area){ const r=Math.random(); return r<0.34 ? genEstimate(area,true) : (r<0.68 ? genEstimateSentence(area) : genEstimateTF(area)); }

function setPrompt(text, spoken){ els.prompt.textContent=nb(text); els.speak.onclick=()=>speak(spoken||text); }

/* ---------- Feedback ---------- */
const GOOD = ['Richtig!','Super!','Genau!','Das stimmt!','Klasse gemacht!'];
const BAD_RULER = ['Schau noch einmal genau auf Anfang und Ende.','Schau auf Anfang und Ende.','Probier es noch einmal.'];
const BAD_UNIT = ['Achte auf die Einheit.','Fast! Schau noch einmal genau hin.','Probier es noch einmal.'];
const BAD_GENERIC = ['Fast! Schau noch einmal genau hin.','Probier es noch einmal.'];
function badMsg(){
  const k = state.currentTask && state.currentTask.kind;
  if(['ruler','rulerText','how'].includes(k)) return pick(BAD_RULER);
  if(['estimate','estimateRev','plausible','plausibleTF','plausibleSentence','unit','unitFill','convert','convertTF','convertExtreme','weightEq'].includes(k)) return pick(BAD_UNIT);
  return pick(BAD_GENERIC);
}
function showFb(msg, good){ els.fb.textContent=msg; els.fb.classList.toggle('good',!!good); els.fb.classList.add('show'); }
function shakeEl(el){ el.classList.add('wrong-shake'); after(430, ()=>el.classList.remove('wrong-shake')); }
function answerClick(isCorrect, el){
  if(state.locked) return;
  if(isCorrect){ state.locked=true; el.classList.add('correct-pulse'); showFb(pick(GOOD), true); after(700, onSuccess); }
  else { shakeEl(el); showFb(badMsg()); }
}

/* ---------- Modi ---------- */
const AREAS = [ {key:'len', label:'Längen', emoji:'📏'}, {key:'wei', label:'Gewichte', emoji:'⚖️'}, {key:'vol', label:'Fassungsvermögen', emoji:'💧'}, {key:'mix', label:'Gemischt', emoji:'🎲'} ];
const LEVELS = [ {key:'leicht', label:'Leicht', emoji:'🌱'}, {key:'mittel', label:'Mittel', emoji:'🌿'}, {key:'schwer', label:'Schwer', emoji:'⭐'} ];
const MODES = [
  {key:'miss', cls:'c1', title:'📏 Miss nach!', sub:'Lineal ablesen', icon:'miss', levels:true},
  {key:'richtig', cls:'c2', title:'📐 Richtig messen', sub:'Lineal anlegen', icon:'richtig'},
  {key:'schaetze', cls:'c3', title:'👀 Schätze mal!', sub:'Größen einschätzen', icon:'eye', areas:true},
  {key:'einheit', cls:'c4', title:'🏷️ Welche Einheit passt?', sub:'Einheit wählen', icon:'tag', areas:true},
  {key:'schwerer', cls:'c5', title:'⚖️ Schwerer oder leichter?', sub:'Gewichte vergleichen', icon:'scale', levels:true},
  {key:'drin', cls:'c6', title:'💧 Wie viel ist drin?', sub:'Messbecher ablesen', icon:'beaker', levels:true},
  {key:'verwandle', cls:'c7', title:'🔄 Verwandle die Einheit!', sub:'Umrechnen', icon:'convert', areas:true, levels:true},
  {key:'stimmt', cls:'c8', title:'🎒 Was könnte stimmen?', sub:'Alltagsgrößen', icon:'bag', areas:true},
  {key:'challenge', cls:'c9', title:'🏆 Messmeister-Challenge', sub:'Alles gemischt', icon:'trophy', levels:true}
];
function modeIcon(k){
  const S = inner => `<svg viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;
  switch(k){
    case 'miss': return S(ICONS.lineal.replace('translate','')+`<g transform="translate(0,-26) scale(.9)">${ICONS.bleistift}</g>`);
    case 'richtig': return S(`<g transform="translate(0,6)">${ICONS.lineal}</g><circle cx="74" cy="28" r="16" fill="#6d8768"/><path d="M66,28 l6,7 l12,-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`);
  case 'eye': return S(`<path d="M6,50 C24,22 76,22 94,50 C76,78 24,78 6,50 Z" fill="#fffdf8" stroke="#3a3226" stroke-width="4"/><circle cx="50" cy="50" r="15" fill="#8fb9c9" stroke="#3a3226" stroke-width="3"/><circle cx="50" cy="50" r="6" fill="#3a3226"/>`);
    case 'tag': return S(`<path d="M12,22 H60 L90,50 L60,78 H12 Z" fill="#eec14a" stroke="#c99a1f" stroke-width="4" stroke-linejoin="round"/><circle cx="26" cy="50" r="5" fill="#fffdf8"/><text x="52" y="58" font-size="22" font-weight="800" text-anchor="middle" fill="#3a3226" font-family="system-ui,sans-serif">cm</text>`);
    case 'scale': return S(`<rect x="46" y="20" width="8" height="64" fill="#7a7062"/><rect x="14" y="16" width="72" height="8" rx="4" fill="#7a7062"/><path d="M20,24 L8,58 H40 Z" fill="none" stroke="#7a7062" stroke-width="3"/><path d="M80,24 L68,58 H100 Z" fill="none" stroke="#7a7062" stroke-width="3" transform="translate(-8,0)"/><rect x="6" y="58" width="36" height="8" rx="3" fill="#d97e55"/><rect x="58" y="58" width="36" height="8" rx="3" fill="#8fa888"/><rect x="30" y="84" width="40" height="7" rx="3" fill="#7a7062"/>`);
    case 'beaker': return S(`<path d="M28,12 H72 L68,86 a4,4 0 0 1 -4,4 H36 a4,4 0 0 1 -4,-4 Z" fill="#eef6f9" stroke="#7a7062" stroke-width="4"/><path d="M31,46 H69 L68,86 a4,4 0 0 1 -4,4 H36 a4,4 0 0 1 -4,-4 Z" fill="#8fb9c9"/><g stroke="#3a3226" stroke-width="3"><line x1="28" y1="28" x2="42" y2="28"/><line x1="29" y1="46" x2="42" y2="46"/><line x1="30" y1="64" x2="42" y2="64"/></g>`);
    case 'convert': return S(`<path d="M18,38 H72 M60,24 L74,38 L60,52" fill="none" stroke="#d97e55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M82,66 H28 M40,52 L26,66 L40,80" fill="none" stroke="#6d8768" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`);
    case 'bag': return S(ICONS.schulranzen);
    case 'trophy': return S(`<path d="M30,14 H70 V42 a20,20 0 0 1 -40,0 Z" fill="#eec14a" stroke="#c99a1f" stroke-width="4"/><path d="M30,20 H16 V28 a14,14 0 0 0 14,14 M70,20 H84 V28 a14,14 0 0 1 -14,14" fill="none" stroke="#c99a1f" stroke-width="4"/><rect x="44" y="60" width="12" height="16" fill="#c99a1f"/><rect x="32" y="76" width="36" height="9" rx="3" fill="#a97a4d"/>`);
  }
  return S('');
}

function buildStart(){
  els.grid.innerHTML='';
  MODES.forEach(m=>{
    const b=document.createElement('button'); b.className='mode-card '+m.cls;
    b.innerHTML=`<div class="mode-icon">${modeIcon(m.icon)}</div><div class="mode-title">${m.title}</div><div class="mode-sub">${m.sub}</div>`;
    b.addEventListener('click',()=>onModeClick(m)); els.grid.appendChild(b);
  });
}
let subSteps=[], subIndex=0, subModeDef=null;
function onModeClick(m){
  clearTimers(); state.mode=m.key; state.area=null; state.level=null;
  subModeDef=m; subSteps=[]; if(m.areas) subSteps.push('area'); if(m.levels) subSteps.push('level');
  if(subSteps.length===0){ startRound(); } else { subIndex=0; showSubStep(); els.start.hidden=true; els.sub.hidden=false; }
}
function showSubStep(){
  const kind=subSteps[subIndex], list=kind==='area'?AREAS:LEVELS;
  els.subTitle.textContent=subModeDef.title;
  els.subStep.textContent = subSteps.length>1 ? `${subIndex+1} von ${subSteps.length}: ${kind==='area'?'Bereich wählen':'Schwierigkeit wählen'}` : (kind==='area'?'Bereich wählen':'Schwierigkeit wählen');
  els.subChoices.innerHTML='';
  list.forEach(o=>{
    const b=document.createElement('button'); b.className='sub-card'; b.innerHTML=`<span class="sub-emoji">${o.emoji}</span><span>${o.label}</span>`;
    b.addEventListener('click',()=>{ state[kind]=o.key; if(subIndex<subSteps.length-1){ subIndex++; showSubStep(); } else startRound(); });
    els.subChoices.appendChild(b);
  });
}
$('btn-sub-back').addEventListener('click',()=>{ if(subIndex>0){ subIndex--; showSubStep(); } else { els.sub.hidden=true; els.start.hidden=false; } });
$('btn-game-back').addEventListener('click',()=>{ clearTimers(); stopSpeech(); els.game.hidden=true; els.start.hidden=false; });
$('btn-game-level').addEventListener('click',()=>{ clearTimers(); stopSpeech(); els.game.hidden=true; subIndex=0; showSubStep(); els.sub.hidden=false; });
$('btn-game-restart').addEventListener('click',()=>startRound());
$('btn-again').addEventListener('click',()=>startRound());
$('btn-other-mode').addEventListener('click',()=>{ els.end.hidden=true; els.start.hidden=false; });
$('btn-sound').addEventListener('click',()=>{ state.soundOn=!state.soundOn; $('btn-sound').textContent=state.soundOn?'🔊':'🔇'; $('btn-sound').setAttribute('aria-pressed',String(state.soundOn)); });
function stopSpeech(){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }

/* ---------- Runde ---------- */
function buildBadges(){ els.badges.innerHTML=''; for(let i=0;i<ROUND_TARGET;i++){ const d=document.createElement('div'); d.className='badge'; els.badges.appendChild(d); } }
function startRound(){
  clearTimers(); stopSpeech();
  state.progress=0; state.locked=false; state.lastKinds=[]; state.kindHist=[]; GEN.used=new Set(); GEN.shown=new Set();   // alten Fortschritt/Aufgaben sauber zuruecksetzen
  els.start.hidden=true; els.sub.hidden=true; els.end.hidden=true; els.game.hidden=false;
  els.btnLevel.hidden = !(subModeDef && (subModeDef.areas||subModeDef.levels));
  els.count.textContent='0'; buildBadges(); newTask();
}
function onSuccess(){
  state.progress=Math.min(ROUND_TARGET,state.progress+1); els.count.textContent=state.progress;
  const b=els.badges.children[state.progress-1]; if(b) b.classList.add('lit');
  if(state.progress>=ROUND_TARGET) after(500,endRound); else after(400,()=>newTask());
}
function endRound(){
  clearTimers(); els.game.hidden=true; els.end.hidden=false;
  els.endArt.innerHTML=['lineal','trinkflasche','schulranzen','eimer'].map(k=>`<div class="ea">${iconSvg(k)}</div>`).join('');
  sndWin(); confetti();
}

/* ---------- Aufgabenwahl ---------- */
function kindGens(mode, a, l){
  // je Modus: welche Aufgabenarten gibt es (fuer gezielte Auswahl, falls Zufall die Rundenregel nicht trifft)
  switch(mode){
    case 'richtig': return {how:()=>genHow(), rulerText:()=>genRulerText()};
    case 'schaetze': return {estimate:()=>genEstimate(a,false), estimateRev:()=>genEstimateReverse(a)};
    case 'einheit': return {unit:()=>genUnit(a), unitFill:()=>genUnitFill(a)};
    case 'schwerer':
      if(l==='leicht') return {heavierA:()=>genHeavierA(3), heavierB:()=>genHeavierB('leicht')};
      if(l==='mittel') return {heavierA:()=>genHeavierA(1.8), heavierB:()=>genHeavierB('mittel'), sign:()=>genSign('mittel')};
      return {heavierB:()=>genHeavierB('schwer'), sign:()=>genSign('schwer'), weightEq:()=>genWeightEq()};
    case 'drin':
      if(l==='leicht') return {drinRead:()=>genDrinRead('leicht'), volCompare:()=>genVolCompare('leicht'), drinMissing:()=>genDrinMissing('leicht')};
      return {drinRead:()=>genDrinRead(l), drinMissing:()=>genDrinMissing(l), drinCompare:()=>genDrinCompare(), volCompare:()=>genVolCompare(l)};
    case 'verwandle':
      return l==='leicht' ? {convert:()=>genConvert(a,l), convertTF:()=>genConvertTF(a,l)}
                          : {convert:()=>genConvert(a,l), convertExtreme:()=>genConvertExtreme(a), convertTF:()=>genConvertTF(a,l)};
    case 'stimmt': return {plausible:()=>genEstimate(a,true), plausibleSentence:()=>genEstimateSentence(a), plausibleTF:()=>genEstimateTF(a)};
  }
  return {};
}
/* Rundenplan: Aufgabenarten werden gleichmaessig verteilt und so gemischt, dass dieselbe Art nicht zu oft hintereinander kommt */
function makePlan(kinds, n, maxRun, counts){
  const base=Math.floor(n/kinds.length), extra=n%kinds.length, bag=[];
  if(counts){ kinds.forEach(k=>{ for(let j=0;j<(counts[k]||0);j++) bag.push(k); }); }       // feste Verteilung (z. B. weniger Aufgaben mit vier Gegenstaenden)
  else shuffle(kinds).forEach((k,i)=>{ const c=base+(i<extra?1:0); for(let j=0;j<c;j++) bag.push(k); });
  for(let tries=0;tries<400;tries++){
    const s=shuffle(bag); let ok=true, run=1;
    for(let i=1;i<s.length;i++){ run = s[i]===s[i-1] ? run+1 : 1; if(run>maxRun){ ok=false; break; } }
    if(ok) return s;
  }
  return shuffle(bag);
}
function planned(maxRun, counts){
  const a=state.area||'mix', l=state.level, kg=kindGens(state.mode,a,l), kinds=Object.keys(kg);
  if(state.kindHist.length===0) state.plan=makePlan(kinds, ROUND_TARGET, maxRun, counts);
  const k=(state.plan||[])[state.kindHist.length];
  const t = kg[k] ? kg[k]() : pick(Object.values(kg))();
  state.kindHist.push(t.kind); return t;
}
function makeTask(){
  const a=state.area||'mix', l=state.level;
  switch(state.mode){
    case 'miss': return genRuler(l);
    case 'richtig': return planned(2);
    case 'schaetze': return planned(2, {estimate:6, estimateRev:2});
    case 'einheit': return planned(2);
    case 'schwerer': return planned(l==='leicht'?2:1);
    case 'drin': return planned(1);
    case 'verwandle': return planned(l==='leicht'?2:1);
    case 'stimmt': return planned(1, {plausible:3, plausibleTF:3, plausibleSentence:2});
    case 'challenge': {
      const cands=CHALLENGE_KINDS.filter(k=>!state.lastKinds.slice(-2).includes(k));
      const k=pick(cands); state.lastKinds.push(k); return genChallengeKind(k,l);
    }
  }
}

/* ---------- Darstellung ---------- */
function newTask(forced){
  state.locked=false; els.fb.classList.remove('show','good'); els.fb.textContent='';
  const t = forced || makeTask(); state.currentTask=t;
  els.body.innerHTML=''; setPrompt(t.prompt, t.spoken||t.prompt);
  if(t.fig){ const f=document.createElement('div'); f.className='fig'+(t.figClass?' '+t.figClass:''); f.innerHTML=t.fig; els.body.appendChild(f); }
  if(t.eq){ const e=document.createElement('div'); e.className='equation'; e.textContent=nb(t.eq); els.body.appendChild(e); }
  if(t.type==='mc') renderMC(t); else if(t.type==='cards') renderCards(t); else if(t.type==='sign') renderSign(t);
  const stage=$('task-stage'); if(stage) stage.scrollTop=0;
}
function renderMC(t){
  const row=document.createElement('div'); row.className='choice-row'+(t.rowClass?' '+t.rowClass:'');
  t.options.forEach(o=>{ const b=document.createElement('button'); b.className='choice-card'+(t.optClass?' '+t.optClass:''); b.textContent=nb(o); b.dataset.value=o;
    b.addEventListener('click',()=>answerClick(o===t.answer,b)); row.appendChild(b); });
  els.body.appendChild(row);
}
function renderCards(t){
  const row=document.createElement('div'); row.className='cards-row '+(t.cardClass||'');
  t.cards.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='tap-card';
    if(t.cardClass==='obj') b.innerHTML=`<div class="tc-icon">${iconSvg(c.icon)}</div><div class="tc-title">${c.title}</div><div class="tc-text">${nb(c.text)}</div>`;
    else if(t.cardClass==='txt') b.innerHTML=`<div class="tc-text">${nb(c.text)}</div>`;
    else b.innerHTML=`${c.html}<div class="tc-cap">${c.caption}</div>`;
    b.setAttribute('aria-label', c.caption || c.text || ('Karte '+(i+1)));
    b.addEventListener('click',()=>answerClick(i===t.answerIdx,b)); row.appendChild(b);
  });
  els.body.appendChild(row);
}
function renderSign(t){
  const row=document.createElement('div'); row.className='sign-row';
  row.innerHTML=`<div class="sign-side">${nb(t.left)}</div><div class="sign-q">?</div><div class="sign-side">${nb(t.right)}</div>`;
  els.body.appendChild(row);
  const btns=document.createElement('div'); btns.className='sign-btns';
  t.options.forEach(o=>{ const b=document.createElement('button'); b.className='sign-btn'; b.textContent=o; b.setAttribute('aria-label', o==='<'?'kleiner':(o==='>'?'größer':'gleich'));
    b.addEventListener('click',()=>answerClick(o===t.answer,b)); btns.appendChild(b); });
  els.body.appendChild(btns);
}

/* ---------- Ton & Konfetti ---------- */
let actx=null; document.addEventListener('pointerdown',()=>{ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } },{once:true});
function tone(f,d,delay){ if(!state.soundOn||!actx) return; try{ const t0=actx.currentTime+(delay||0), o=actx.createOscillator(), g=actx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(f,t0); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.13,t0+.02); g.gain.exponentialRampToValueAtTime(.001,t0+d); o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+d+.03); }catch(e){} }
function sndWin(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,i*.11)); }
function confetti(){
  const c=document.createElement('canvas'); c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:30;'; document.body.appendChild(c);
  const ctx=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight; const cols=['#d98a92','#8fa888','#eec14a','#d97e55','#8fb9c9'];
  const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,w:4+Math.random()*6,h:6+Math.random()*10,vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*360,vr:-6+Math.random()*12,c:cols[Math.floor(Math.random()*cols.length)]}));
  let n=0; (function loop(){ n++; ctx.clearRect(0,0,c.width,c.height); ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r*Math.PI/180); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }); if(n<200) requestAnimationFrame(loop); else c.remove(); })();
}

buildStart();
window.__mmDebug = { state, forceTask:t=>newTask(t), makeTask, GEN, sayUnits, startRound, showSubStep,
  core:{convert,convertLength,convertWeight,convertVolume,toBase,formatMeasure,formatLength,formatWeight,formatVolume,formatCompound,compareMeasurements,UNITS,BASE},
  gens:{genEstimateVar,genPlausibleVar,genUnitVar,genConvertVar,genEstimateReverse,genEstimateTF,genEstimateSentence,genUnitFill,genConvertExtreme,genConvertTF,genRuler,genHow,genRulerText,genEstimate,genUnit,genHeavier,genHeavierA,genHeavierB,genSign,genWeightEq,genDrin,genDrinRead,genDrinMissing,genDrinCompare,genVolCompare,genConvert,genChallengeKind},
  gfx:{measureSvg,vesselSvg}, data:{EST,UNIT_Q,WEIGHT_OBJ,CHALLENGE_KINDS,OBJ_ICON,OBJ_META}, setMode:(m,a,l)=>{ state.mode=m; state.area=a; state.level=l; } };
})();
</script>
